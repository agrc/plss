name: Release Events

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true

permissions:
  id-token: write
  deployments: write

jobs:
  deploy-dev:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://plss.dev.utah.gov
    if: github.event.release.prerelease == true

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: 📃 Configure 3rd party notice
        uses: agrc/third-party-notice-composite-action@v1

      - name: 🚀 Deploy
        uses: agrc/firebase-website-deploy-composite-action@v2
        with:
          identity-provider: ${{ secrets.IDENTITY_PROVIDER }}
          service-account-email: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          project-id: ${{ secrets.PROJECT_ID }}
          build-command: pnpm build
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          VITE_DISCOVER_KEY: ${{ secrets.VITE_DISCOVER_KEY }}
          VITE_API_KEY: ${{ secrets.VITE_UGRC_API_KEY }}

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://plss.utah.gov
    if: github.event.release.prerelease == false

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: 📃 Configure 3rd party notice
        uses: agrc/third-party-notice-composite-action@v1

      - name: 🚀 Deploy
        uses: agrc/firebase-website-deploy-composite-action@v2
        with:
          identity-provider: ${{ secrets.IDENTITY_PROVIDER }}
          service-account-email: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          project-id: ${{ secrets.PROJECT_ID }}
          service-now-instance: ${{ secrets.SN_INSTANCE }}
          service-now-table: ${{ secrets.SN_TABLE }}
          service-now-system-id: ${{ secrets.SN_SYS_ID }}
          service-now-username: ${{ secrets.SN_USERNAME }}
          service-now-password: ${{ secrets.SN_PASSWORD }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          build-command: pnpm build
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          VITE_DISCOVER_KEY: ${{ secrets.VITE_DISCOVER_KEY }}
          VITE_API_KEY: ${{ secrets.VITE_UGRC_API_KEY }}

  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: 💬 Comment on issues in release
        uses: agrc/release-issue-notifications-action@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 💬 Post production release to Google Chat
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          payload=$(jq -n \
            --arg release_name "$RELEASE_NAME" \
            --arg release_url "$RELEASE_URL" \
            '{text: ("Production release deployed: " + $release_name + "\n" + $release_url)}')
          curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$GOOGLE_CHAT_WEBHOOK_URL"
